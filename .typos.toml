[default.extend-words]
cna = "cna"
ket = "ket"
NAX = "NAX"
fo = "fo"
fpr = "fpr"
Ba = "Ba"
Ptd = "Ptd"

[default]
# Deliberately malformed JSON literals in rezzy-json invalid-input tests.
extend-ignore-re = ['"tru",', '"nulll",']

[files]
extend-exclude = ["tests/critique_data/**", "tests/fixtures/**"]
