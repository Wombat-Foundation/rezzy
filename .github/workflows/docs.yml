---
name: Rust Docs

on:
  push:
    branches: ["master", "dev"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: dev

      - uses: actions/checkout@v4
        with:
          ref: master
          path: master

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build rustdoc for master
        run: make -C master rust/doc

      - name: Build rustdoc for dev
        run: make -C dev rust/doc

      - name: Prepare flat deploy directory
        run: |
          prepare() {
            local src="$1" dst="$2"
            cp -a "$src" "$dst"
            cp -a "$dst"/rezzy/. "$dst"/
            rm -rf "$dst"/rezzy
            find "$dst" \( -name '*.html' -o -name '*.js' \) -print0 | xargs -0 perl -pi -e \
              's{(href|src|content|data-[a-z-]+)="((?:\.\./)+)}{ my $n = length($2)/3; my $p = $n > 1 ? "../" x ($n-1) : "./"; $1 . "=\"" . $p }ge'
            find "$dst" \( -name '*.html' -o -name '*.js' \) -print0 | xargs -0 sed -i 's|rezzy/index\.html|index.html|g'
          }
          prepare master/target/doc _site
          prepare dev/target/doc _site/dev

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: _site
          destination_dir: .
