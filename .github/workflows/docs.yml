---
name: Rust Docs

on:
  push:
    branches: ["master", "dev"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  docs:
    if: github.ref_name == 'master' || github.ref_name == 'dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build rustdoc
        run: make rust/doc

      - name: Prepare flat deploy directory
        run: |
          cp -a target/doc _site
          cp -a _site/rezzy/. _site/
          rm -rf _site/rezzy
          find _site \( -name '*.html' -o -name '*.js' \) -print0 | xargs -0 perl -pi -e \
            's{(href|src|content|data-[a-z-]+)="((?:\.\./)+)}{ my $n = length($2)/3; my $p = $n > 1 ? "../" x ($n-1) : "./"; $1 . "=\"" . $p }ge'
          find _site \( -name '*.html' -o -name '*.js' \) -print0 | xargs -0 sed -i 's|rezzy/index\.html|index.html|g'

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: _site
          destination_dir: ${{ github.ref_name == 'dev' && 'dev' || '' }}
          keep_files: true
