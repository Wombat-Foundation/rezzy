---
name: Rust Docs

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  docs:
    if: github.ref_name == 'master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: master
          path: master

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build rustdoc for master
        run: make -C master doc

      - name: Prepare flat deploy directory
        run: |
          prepare() {
            local src="$1" dst="$2"
            cp -a "$src" "$dst"
            # Depth-reduction: only files that are about to move out of
            # rezzy/ get one level shallower, so only rewrite those --
            # dependency-crate docs and the src/ source-view mirrors stay
            # at their original depth and must not have their `../` count
            # touched.
            find "$dst"/rezzy \( -name '*.html' -o -name '*.js' \) -print0 | xargs -0 perl -pi -e \
              's{(href|src|content|data-[a-z-]+)="((?:\.\./)+)}{ my $n = length($2)/3; my $p = $n > 1 ? "../" x ($n-1) : "./"; $1 . "=\"" . $p }ge'
            cp -a "$dst"/rezzy/. "$dst"/
            rm -rf "$dst"/rezzy
            # Crate-index rename: applies tree-wide regardless of whether
            # the linking file moved -- any page anywhere may reference the
            # crate's now-flattened index.
            find "$dst" \( -name '*.html' -o -name '*.js' \) -print0 | xargs -0 sed -i 's|rezzy/index\.html|index.html|g'
          }
          prepare master/target/doc _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
