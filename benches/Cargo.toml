[package]
name = "rezzy-benches"
version = "0.6.0-rc.0"
edition = "2021"
rust-version = "1.90"
publish = false
autobenches = false

# Keep benchmark-only comparison dependencies out of the main workspace.
[workspace]

[dependencies]
base64 = { version = "0.23", default-features = false, features = ["alloc"] }
blake2 = { version = "0.11", default-features = false }
blake3 = { version = "1.5", default-features = false }
ed25519-dalek = { version = "3", default-features = false, features = ["alloc", "batch"] }
imbl = { version = "7.0", default-features = false }
rezzy = { path = "..", features = ["signing", "signing-consensus"] }
rezzy-recon = { path = "../rezzy-recon", version = "0.6.0-rc.1" }
roaring = { version = "0.11", default-features = false }
ruma-common = "0.20"
ruma-events = "0.35"
ruma-signatures = "0.22"
ruma-state-res = { version = "0.18", features = ["__criterion"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = { version = "0.11", default-features = false }
sha3 = { version = "0.10", default-features = false }

[dev-dependencies]
ed25519-consensus = { version = "2.1", default-features = false, features = ["std"] }
rand_08 = { package = "rand", version = "0.8" }
simd-json = { version = "0.18", features = ["serde_impl", "runtime-detection", "swar-number-parsing"] }

[[bench]]
name = "rezzy"
path = "main.rs"
harness = false

[[bench]]
name = "signature_verify"
path = "signature_verify.rs"
harness = false

[[bench]]
name = "ed25519_backends"
path = "ed25519_backends.rs"
harness = false

[[bench]]
name = "compare-ruma"
path = "compare_ruma.rs"
harness = false
