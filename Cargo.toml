[package]
name = "rezzy"
version = "0.6.0"
edition = "2021"
rust-version = "1.75"
resolver = "2"
autobins = false
authors = ["Shane Jaroch <chown_tee@proton.me>"]
description = "Lightweight and formally verified: State Res v1, v2, and v2.1 reference implementations in Rust."
license = "MIT OR Apache-2.0"
repository = "https://github.com/gamesguru/rezzy"
autotests = false
default-run = "rezzy"
exclude = [
    "build.rs",
    "res/",
    "scripts/",
    "docs/",
    "RumaLean/",
    "RumaLean.lean",
    "lake*",
    "lean-toolchain",
    ".codecov.yml",
    ".envrc",
    ".env.example",
    ".github",
    ".gitignore",
    ".editorconfig",
    ".pre-commit-config.yaml",
    ".prettierignore",
    ".prettierrc",
    ".rgignore",
    ".ignore",
    ".gitmodules",
    ".typos.toml",
    ".cargo/cargo-wrapper.sh",
    ".cargo/config.toml",
    "rustfmt.toml",
    "tests/",
    "Makefile",
]

[package.metadata.cargo-machete]
ignored = [
    # Direct optional anchors for transitive CLI dependency versions that still
    # parse and build on the Rust 1.75 MSRV.
    "idna_adapter",
]

[[bin]]
name = "rezzy"
path = "src/bin/rezzy/main.rs"
required-features = ["cli"]

[[bin]]
name = "regen_oracles"
path = "tests/regen_oracles.rs"
required-features = ["regen"]

[[bin]]
name = "bench_files"
path = "scripts/bench_files.rs"

[features]
default = ["std", "hashing"]
std = ["alloc", "serde_json/std", "serde/std", "dep:roaring"]
alloc = []
cli = [
    "std",
    "dep:clap",
    "dep:anyhow",
    "dep:ureq",
    "dep:idna_adapter",
    "mimalloc",
    "ureq/tls",
    "dep:zeroize",
]
regen = ["std"]
hashing = []
signing = []
mock-ruma = [
    "dep:insta",
    "dep:ruma-common",
    "dep:ruma-events",
    "dep:ruma-state-res",
    "dep:test-log",
]
stress = ["dep:bincode"]
mimalloc = ["dep:mimalloc"]

[dependencies]
anyhow = { version = "1.0", optional = true }
base64 = { version = "0.22.1", default-features = false, features = ["alloc"] }
bincode = { version = "1", optional = true }
blake2 = { version = "0.10", default-features = false }
clap = { version = "=4.5.48", optional = true, features = ["derive", "env"] }
hashbrown = { version = "0.15", default-features = false, features = [
    "default-hasher",
    "inline-more",
] }
idna_adapter = { version = ">=1.0, <1.2", optional = true, default-features = false }
imbl = { version = "3.0", default-features = false, features = ["serde"] }
insta = { version = "1.47.2", optional = true }
mimalloc = { version = "0.1.52", optional = true }

roaring = { version = "0.10", optional = true } # compatible with the Rust 1.75 MSRV
ruma-common = { version = "0.19.0", optional = true }
ruma-events = { version = "0.34.0", optional = true }
ruma-state-res = { version = "0.17.0", optional = true, features = [
    "__criterion",
] }
serde = { version = "1.0", default-features = false, features = [
    "alloc",
    "derive",
] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
sha2 = { version = "0.10", default-features = false }
sha3 = { version = "0.10", default-features = false }
test-log = { version = "0.2.20", optional = true }
ureq = { version = "2.9", optional = true, default-features = false, features = [
    "json",
] }
zeroize = { version = "=1.8.2", optional = true, default-features = false }

[dev-dependencies]
rayon = "1.10.0"
similar = "2.7.0"

[[bench]]
name = "reconcile"
harness = false

[[bench]]
name = "resolve"
path = "benches/resolve.rs"
harness = false

[[bench]]
name = "state_backend"
path = "benches/state_backend.rs"
harness = false

[[bench]]
name = "mainline_cache"
path = "benches/mainline_cache.rs"
harness = false

[[test]]
name = "test_snapshots"
path = "tests/test_snapshots.rs"
required-features = ["stress"]

[[test]]
name = "test_sanity"
path = "tests/test_sanity.rs"

[[test]]
name = "test_hashing"
path = "tests/test_hashing.rs"

[[test]]
name = "test_merkle"
path = "tests/test_merkle.rs"

[[test]]
name = "test_reconcile_algebraic"
path = "tests/test_reconcile_algebraic.rs"

[[test]]
name = "test_traversal"
path = "tests/test_traversal.rs"

[[test]]
name = "stress_large_rooms"
path = "tests/stress_large_rooms.rs"
required-features = ["stress"]

[[test]]
name = "test_pathologies"
path = "tests/test_pathologies.rs"

[[test]]
name = "test_critique"
path = "tests/test_critique.rs"

[[test]]
name = "test_auth"
path = "tests/test_auth.rs"

[[test]]
name = "test_lib"
path = "tests/test_lib.rs"

[[test]]
name = "test_main"
path = "tests/test_main.rs"
required-features = ["cli"]

[[test]]
name = "stress_unredacted_lounge"
path = "tests/stress_unredacted_lounge.rs"
required-features = ["stress"]

[[test]]
name = "test_integer_keys"
path = "tests/test_integer_keys.rs"

[[test]]
name = "test_restricted_joins"
path = "tests/test_restricted_joins.rs"

[[test]]
name = "test_utils"
path = "tests/test_utils.rs"

[[test]]
name = "test_tombstone"
path = "tests/test_tombstone.rs"

[[test]]
name = "test_state_at"
path = "tests/test_state_at.rs"

[[test]]
name = "test_resolve"
path = "tests/test_resolve.rs"
required-features = ["mock-ruma"]

[[test]]
name = "test_lattice"
path = "tests/test_lattice.rs"

[lints.rust]
unsafe_code = "deny"
unexpected_cfgs = { level = "warn", check-cfg = [
    "cfg(coverage)",
    "cfg(coverage_nightly)",
    "cfg(tarpaulin)",
    "cfg(has_res_submodule)",
] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
similar_names = "allow"

# High-Value Security & Robustness restrictions
arithmetic_side_effects = "warn"
undocumented_unsafe_blocks = "warn"
dbg_macro = "warn"
get_unwrap = "warn"

[profile.release-max-perf]
inherits = "release"
strip = "symbols"
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.release]
strip = "symbols"
lto = "thin"
