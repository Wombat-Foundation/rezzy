
# ──────────────────────────────────────────────────────────────────
# Root facade package — re-exports rz-core for backwards compat.
# Tests, benches, and auxiliary binaries live here.
# ──────────────────────────────────────────────────────────────────

[package]
name = "rezzy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Lightweight and formally verified: State Res v1, v2, and v2.1 reference implementations in Rust."
keywords = ["matrix", "state-resolution", "federation", "verification"]
categories = ["algorithms", "mathematics"]
default-run = "rezzy"
autobins = false
autobenches = false
autotests = false
exclude = [
    "build.rs",
    "res/",
    "scripts/",
    "docs/",
    "RumaLean/",
    "RumaLean.lean",
    "lake*",
    "lean-toolchain",
    ".codecov.yml",
    ".envrc",
    ".env.example",
    ".github",
    ".gitignore",
    ".editorconfig",
    ".pre-commit-config.yaml",
    ".prettierignore",
    ".prettierrc",
    ".rgignore",
    ".ignore",
    ".gitmodules",
    ".typos.toml",
    ".cargo/cargo-wrapper.sh",
    ".cargo/config.toml",
    "rustfmt.toml",
    "tests/",
    "Makefile",
]

[package.metadata.cargo-machete]
ignored = ["idna_adapter", "zeroize"]
[workspace]
resolver = "2"
members = ["rz-cli", "rz-core", "rz-json", "rz-reconcile"]

[workspace.package]
version = "0.6.0-rc.0"
edition = "2021"
rust-version = "1.81"
authors = ["Shane Jaroch <chown_tee@proton.me>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/gamesguru/rezzy"

[workspace.dependencies]
rz-cli = { path = "rz-cli" }
rz-core = { path = "rz-core" }
rz-json = { path = "rz-json" }
rz-reconcile = { path = "rz-reconcile" }

base64 = { version = "0.22.1", default-features = false, features = ["alloc"] }
blake2 = { version = "0.10", default-features = false }
hashbrown = { version = "0.15", default-features = false, features = ["default-hasher", "inline-more"] }
imbl = { version = "3.0", default-features = false }
roaring = { version = "0.10", default-features = false }
ryu = { version = "1.0", default-features = false }
serde = { version = "1.0", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
sha2 = { version = "0.10", default-features = false }
sha3 = { version = "0.10", default-features = false }
simd-json = { version = "=0.14.3", default-features = false, features = ["runtime-detection", "swar-number-parsing"] }

# CLI-only
clap = { version = "=4.5.48", features = ["derive", "env"] }
idna_adapter = { version = ">=1.0, <1.2", default-features = false }
mimalloc = { version = "0.1.52" }
ureq = { version = "2.9", default-features = false, features = ["json"] }

# Signing
ed25519-dalek = { version = "2", default-features = false, features = ["std", "batch"] }

# Ruma interop (dev/test)
ruma-common = { version = "0.19.0" }
ruma-events = { version = "0.34.0" }
ruma-signatures = { version = "0.21" }
ruma-state-res = { version = "0.17.0", features = ["__criterion"] }

# Dev dependencies
bincode = "1"
ed25519-consensus = { version = "2.1", default-features = false, features = ["std"] }
insta = "1.47.2"
rand_08 = { package = "rand", version = "0.8" }
similar = "2.7.0"
test-case = "3.3.1"
test-log = "0.2.20"
zeroize = "=1.8.1"

[workspace.lints.rust]
unsafe_code = "deny"
unexpected_cfgs = { level = "warn", check-cfg = [
    "cfg(coverage)",
    "cfg(coverage_nightly)",
    "cfg(tarpaulin)",
    "cfg(tarpaulin_include)",
    "cfg(has_res_submodule)",
    "cfg(has_avx512_support)",
    "cfg(has_avx512_host_support)",
] }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
similar_names = "allow"
multiple_crate_versions = "allow"
arithmetic_side_effects = "warn"
undocumented_unsafe_blocks = "warn"
dbg_macro = "warn"
get_unwrap = "warn"

[[bin]]
name = "rezzy"
path = "src/bin/rezzy.rs"
required-features = ["cli"]
test = false

[[bin]]
name = "regen-oracles"
path = "scripts/regen_oracles.rs"
required-features = ["regen"]
test = false

[[bin]]
name = "bench-ruma-vs-rezzy"
path = "scripts/bench_ruma_vs_rezzy.rs"
required-features = ["mock-ruma"]
test = false

[features]
default = ["std"]
std = ["rz-core/std"]
cli = ["std", "rz-core/cli", "dep:rz-cli"]
regen = ["std"]
signing = ["rz-core/signing"]
signing-dalek = ["rz-core/signing-dalek"]
mock-ruma = [
    "rz-core/mock-ruma",
    "dep:ruma-common",
    "dep:ruma-events",
    "dep:ruma-signatures",
    "dep:ruma-state-res",
    "dep:serde_json",
]
stress = []
hashing = []
simd-json-bench = ["dep:simd-json", "simd-json/serde_impl"]
unstable-refcount-gc = ["rz-core/unstable-refcount-gc"]

[dependencies]
base64.workspace = true
imbl.workspace = true
ruma-common = { workspace = true, optional = true }
ruma-events = { workspace = true, optional = true }
ruma-signatures = { workspace = true, optional = true }
ruma-state-res = { workspace = true, optional = true }
rz-cli = { workspace = true, optional = true }
rz-core.workspace = true
rz-reconcile.workspace = true
serde_json = { workspace = true, optional = true }
sha2.workspace = true
simd-json = { workspace = true, optional = true }

[dev-dependencies]
base64.workspace = true
bincode.workspace = true
ed25519-consensus.workspace = true
ed25519-dalek.workspace = true
hashbrown.workspace = true
imbl.workspace = true
insta.workspace = true
rand_08.workspace = true
roaring.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
simd-json.workspace = true
similar.workspace = true
test-case.workspace = true
test-log.workspace = true
zeroize.workspace = true

[profile.release-max-perf]
inherits = "release"
strip = "symbols"
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.release]
strip = "symbols"
lto = "thin"

[profile.dev]
opt-level = 0
debug = 0
strip = "debuginfo"
incremental = true
codegen-units = 256

[profile.test]
debug = 0
strip = "debuginfo"
incremental = true
codegen-units = 256

[[example]]
name = "bench_files"
path = "scripts/bench_files.rs"

[[bench]]
name = "rezzy"
path = "benches/main.rs"
harness = false
test = false

[[bench]]
name = "signature_verify"
path = "benches/signature_verify.rs"
harness = false
test = false
required-features = ["signing", "mock-ruma", "simd-json-bench"]

[[bench]]
name = "ed25519_backends"
path = "benches/ed25519_backends.rs"
harness = false
test = false
required-features = ["signing-dalek"]

[lints]
workspace = true
