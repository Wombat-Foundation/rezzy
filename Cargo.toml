[package]
name = "rezzy"
version = "0.6.0"
edition = "2021"
rust-version = "1.81"
resolver = "2"
autobins = false
autobenches = false
authors = ["Shane Jaroch <chown_tee@proton.me>"]
description = "Lightweight and formally verified: State Res v1, v2, and v2.1 reference implementations in Rust."
keywords = ["matrix", "state-resolution", "federation", "verification"]
categories = ["algorithms", "mathematics"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/gamesguru/rezzy"
default-run = "rezzy"
exclude = [
    "build.rs",
    "res/",
    "scripts/",
    "docs/",
    "RumaLean/",
    "RumaLean.lean",
    "lake*",
    "lean-toolchain",
    ".codecov.yml",
    ".envrc",
    ".env.example",
    ".github",
    ".gitignore",
    ".editorconfig",
    ".pre-commit-config.yaml",
    ".prettierignore",
    ".prettierrc",
    ".rgignore",
    ".ignore",
    ".gitmodules",
    ".typos.toml",
    ".cargo/cargo-wrapper.sh",
    ".cargo/config.toml",
    "rustfmt.toml",
    "tests/",
    "Makefile",
]

[package.metadata.cargo-machete]
ignored = [
    # Direct optional anchors for transitive CLI dependency versions that still
    # parse and build on the Rust 1.81 MSRV.
    "idna_adapter",
]

[[bin]]
name = "rezzy"
path = "src/bin/rezzy/main.rs"
required-features = ["cli"]
test = false

[[bin]]
name = "regen_oracles"
path = "tests/bin/regen_oracles.rs"
required-features = ["regen"]
test = false

[[example]]
name = "bench_files"
path = "scripts/bench_files.rs"

[[bin]]
name = "bench_ruma_vs_rezzy"
path = "scripts/bench_ruma_vs_rezzy.rs"
required-features = ["mock-ruma"]
test = false

[features]
default = ["std", "signing"]
std = ["alloc", "serde_json/std", "serde/std", "dep:roaring"]
alloc = []
cli = [
    "std",
    "dep:clap",
    "dep:anyhow",
    "dep:ureq",
    "dep:idna_adapter",
    "mimalloc",
    "ureq/tls",
    "dep:zeroize",
]
regen = ["std"]
# Event signature verification. `signing` defaults to the RFC-8032 (ed25519-
# dalek) backend, which shares rezzy's sha2 0.10 (no duplicate sha2 crate).
# The consensus-strict (ZIP-215, ed25519-consensus) backend is available via
# `signing-consensus` for callers that need Synapse/Dendrite parity; it pulls
# its own sha2 0.9 chain.
signing = ["signing-dalek"]
signing-consensus = ["alloc", "dep:ed25519-consensus"]
signing-dalek = ["alloc", "dep:ed25519-dalek"]
# Fast JSON parsing (simd-json) — opt-in. simd-json only wins on LARGE single
# JSON documents; at PDU scale serde_json measures ~1.1x faster (small PDUs,
# per-call mutable-buffer clone), so it is NOT a default dependency. When
# enabled, keep the SIMD parsing/`runtime-detection` speed features but NOT
# `serde_impl` (serde JSON interop); that is pulled only by `simd-json-serde`
# for dev/bench.
simd-json = ["dep:simd-json"]
simd-json-serde = ["simd-json", "simd-json/serde_impl"]
mock-ruma = [
    "dep:insta",
    "dep:ruma-common",
    "dep:ruma-events",
    "dep:ruma-state-res",
    "dep:ruma-signatures",
    "dep:test-log",
]
stress = ["dep:bincode"]
mimalloc = ["dep:mimalloc"]
# Compatibility alias: the `hashing` feature was removed, but downstream
# manifests that request `rezzy/hashing` must still resolve.
hashing = []

[dependencies]
anyhow = { version = "1.0", optional = true }
base64 = { version = "0.22.1", default-features = false, features = ["alloc"] }
bincode = { version = "1", optional = true }
blake2 = { version = "0.10", default-features = false }
clap = { version = "=4.5.48", optional = true, features = ["derive", "env"] }
ed25519-consensus = { version = "2.1", optional = true, default-features = false }
ed25519-dalek = { version = "2", optional = true, default-features = false, features = [
    "std",
    "batch",
] }
hashbrown = { version = "0.15", default-features = false, features = [
    "default-hasher",
    "inline-more",
] }
idna_adapter = { version = ">=1.0, <1.2", optional = true, default-features = false }
imbl = { version = "3.0", default-features = false, features = ["serde"] }
insta = { version = "1.47.2", optional = true }
mimalloc = { version = "0.1.52", optional = true }

roaring = { version = "0.10", optional = true } # compatible with the Rust 1.81 MSRV
ruma-common = { version = "0.19.0", optional = true }
ruma-events = { version = "0.34.0", optional = true }
ruma-signatures = { version = "0.21", optional = true }
ruma-state-res = { version = "0.17.0", optional = true, features = [
    "__criterion",
] }
serde = { version = "1.0", default-features = false, features = [
    "alloc",
    "derive",
] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
sha2 = { version = "0.10", default-features = false }
sha3 = { version = "0.10", default-features = false }
simd-json = { version = "0.18", optional = true, default-features = false, features = [
    "swar-number-parsing",
    "runtime-detection",
] }
test-log = { version = "0.2.20", optional = true }
ureq = { version = "2.9", optional = true, default-features = false, features = [
    "json",
] }
zeroize = { version = "=1.8.2", optional = true, default-features = false }

[dev-dependencies]
similar = "2.7.0"

[[bench]]
name = "rezzy"
path = "benches/rezzy/main.rs"
harness = false
test = false

[[bench]]
name = "signature_verify"
path = "benches/signature_verify.rs"
harness = false
test = false
required-features = ["signing", "mock-ruma", "simd-json-serde"]

[[test]]
name = "unit"
path = "tests/unit/main.rs"

[[test]]
name = "test_snapshots"
path = "tests/test_snapshots.rs"
required-features = ["stress"]

[[test]]
name = "stress_large_rooms"
path = "tests/stress_large_rooms.rs"
required-features = ["stress"]

[[test]]
name = "test_main"
path = "tests/test_main.rs"
required-features = ["cli"]

[[test]]
name = "stress_unredacted_lounge"
path = "tests/stress_unredacted_lounge.rs"
required-features = ["stress"]

[[test]]
name = "test_resolve"
path = "tests/test_resolve.rs"
required-features = ["mock-ruma"]

[lints.rust]
unsafe_code = "deny"
unexpected_cfgs = { level = "warn", check-cfg = [
    "cfg(coverage)",
    "cfg(coverage_nightly)",
    "cfg(tarpaulin)",
    "cfg(has_res_submodule)",
] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
similar_names = "allow"
# Build-time proc-macro duplication only: curve25519-dalek-derive uses syn 3.0
# while most of the graph is on syn 2.0. This is unavoidable, benign, and does
# not affect the runtime binary.
multiple_crate_versions = "allow"

# High-Value Security & Robustness restrictions
arithmetic_side_effects = "warn"
undocumented_unsafe_blocks = "warn"
dbg_macro = "warn"
get_unwrap = "warn"

[profile.release-max-perf]
inherits = "release"
strip = "symbols"
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.release]
strip = "symbols"
lto = "thin"
