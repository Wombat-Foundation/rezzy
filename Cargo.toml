# ──────────────────────────────────────────────────────────────────
# Workspace root.
#
# The root package IS the `rezzy` library (core: auth, state, resolve,
# HAMT, Merkle). The `rezzy-cli` package produces the `rezzy` binary,
# and `rezzy-json` and `rezzy-recon` are the supporting sub-crates.
# ──────────────────────────────────────────────────────────────────

[package]
name = "rezzy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "Core Matrix state resolution engine: auth, state, resolve, HAMT, and Merkle primitives."
keywords = ["matrix", "state-resolution", "federation", "verification"]
categories = ["algorithms", "mathematics"]
exclude = [
    "build.rs",
    "res/",
    "scripts/",
    "docs/",
    "spec/",
    "benches/",
    "RumaLean/",
    "RumaLean.lean",
    "lake*",
    "lean-toolchain",
    ".codecov.yml",
    ".envrc",
    ".env.example",
    ".github",
    ".gitignore",
    ".editorconfig",
    ".pre-commit-config.yaml",
    ".prettierignore",
    ".prettierrc",
    ".rgignore",
    ".ignore",
    ".gitmodules",
    ".typos.toml",
    ".cargo/",
    "rustfmt.toml",
    "tests/",
    "support/",
    "Makefile",
    "TODO.txt",
    "pr-comments.14.md",
    "changes.diff",
    "c.diff",
    ".markdownlint.json",
    "examples/",
    "support/",
    "rust-toolchain.toml",
]
autobins = false
autobenches = false
autotests = false

[package.metadata.cargo-machete]
ignored = ["zeroize"]

[workspace]
resolver = "2"
members = ["rezzy-cli", "rezzy-json", "rezzy-recon"]

[workspace.package]
version = "0.6.0-rc.1"
edition = "2021"
rust-version = "1.90"
authors = ["Shane Jaroch <chown_tee@proton.me>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/gamesguru/rezzy"

[workspace.dependencies]
rezzy = { path = ".", version = "0.6.0-rc.1" }
rezzy-cli = { path = "rezzy-cli", version = "0.6.0-rc.1" }
rezzy-json = { path = "rezzy-json", version = "0.6.0-rc.1" }
rezzy-recon = { path = "rezzy-recon", version = "0.6.0-rc.1" }

base64 = { version = "0.23", default-features = false, features = ["alloc"] }
blake3 = { version = "1.5", default-features = false }
hashbrown = { version = "0.17", default-features = false, features = ["default-hasher", "inline-more"] }
imbl = { version = "7.0", default-features = false }
roaring = { version = "0.11", default-features = false }
ryu = { version = "1.0", default-features = false }
sha2 = { version = "0.11", default-features = false }
sha3 = { version = "0.12", default-features = false }

# CLI-only
clap = { version = "4.5.48", default-features = false, features = ["std", "env", "help", "usage", "error-context", "color", "suggestions"] }
clap_complete = { version = "4.5.48", default-features = false }
mimalloc = { version = "0.1.52" }
ureq = { version = "3", default-features = false }

# Signing
ed25519-consensus = { version = "2.1", default-features = false }
keyring = { version = "4", default-features = false, features = ["v1"] }

# Dev dependencies
insta = "1.47.2"
rand_08 = { package = "rand", version = "0.10" }
similar = "3.2"
test-case = "3.3.1"
test-log = "0.2.20"
zeroize = "1.8.1"

[workspace.lints.rust]
rust_2018_idioms = { level = "deny", priority = -1 }
unused_must_use = "deny"
rust_2024_incompatible_pat = "warn"
missing_docs = "warn"
elided_lifetimes_in_paths = "warn"
unreachable_pub = "warn"
unused_lifetimes = "warn"
unsafe_code = "deny"
unexpected_cfgs = { level = "warn", check-cfg = [
    "cfg(coverage)",
    "cfg(coverage_nightly)",
    "cfg(tarpaulin)",
    "cfg(tarpaulin_include)",
    "cfg(has_res_submodule)",
    "cfg(has_avx512_support)",
    "cfg(has_avx512_host_support)",
] }
[workspace.lints.rustdoc]
all = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
similar_names = "allow"
multiple_crate_versions = "allow"
arithmetic_side_effects = "warn"
undocumented_unsafe_blocks = "warn"
dbg_macro = "warn"
get_unwrap = "warn"
semicolon_if_nothing_returned = "warn"
match_bool = "warn"
needless_pass_by_value = "warn"

# Known project-wide exceptions.
redundant_pub_crate = "allow"
too_long_first_doc_paragraph = "allow"
unused_peekable = "allow"
tuple_array_conversions = "allow"
transmute_undefined_repr = "allow"
cognitive_complexity = "allow"

[[bin]]
name = "regen-oracles"
path = "src/bin/regen_oracles.rs"
required-features = ["regen"]

[features]
default = ["std"]
std = []
cli = ["std", "dep:clap"]
regen = ["std"]
# Backend-agnostic signature verification (`SignatureVerifier`, `verify_event_signatures`).
signing-core = []
signing = ["signing-consensus"]
signing-consensus = ["signing-core", "dep:ed25519-consensus"]
stress = []
hashing = []
unstable-refcount-gc = []

[dependencies]
rezzy-json.workspace = true

base64.workspace = true
blake3.workspace = true
hashbrown.workspace = true
imbl.workspace = true
roaring.workspace = true
sha2.workspace = true
sha3.workspace = true

# Optional
clap = { workspace = true, optional = true }
ed25519-consensus = { workspace = true, optional = true }

[dev-dependencies]
base64.workspace = true
hashbrown.workspace = true
imbl.workspace = true
insta.workspace = true
rand_08.workspace = true
rezzy-recon.workspace = true
roaring.workspace = true
sha2.workspace = true
similar.workspace = true
test-case.workspace = true
test-log.workspace = true
zeroize.workspace = true

[lints.rust]
unsafe_code = "deny"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unexpected_cfgs = { level = "warn", check-cfg = [
    "cfg(coverage)",
    "cfg(coverage_nightly)",
    "cfg(tarpaulin)",
    "cfg(has_res_submodule)",
    "cfg(tarpaulin_include)",
    "cfg(has_avx512_support)",
    "cfg(has_avx512_host_support)",
] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
similar_names = "allow"
multiple_crate_versions = "allow"
arithmetic_side_effects = "warn"
undocumented_unsafe_blocks = "warn"
dbg_macro = "warn"
get_unwrap = "warn"

[[test]]
name = "test_zero_alloc"
path = "tests/test_zero_alloc.rs"

[[test]]
name = "unit"
path = "tests/unit/main.rs"

[[test]]
name = "test_snapshots"
path = "tests/test_snapshots.rs"
required-features = ["stress"]

[[test]]
name = "stress_large_rooms"
path = "tests/stress_large_rooms.rs"
required-features = ["stress"]

[[test]]
name = "stress_unredacted_lounge"
path = "tests/stress_unredacted_lounge.rs"
required-features = ["stress"]

[[test]]
name = "test_main"
path = "tests/test_main.rs"
required-features = ["cli"]

[profile.release-max-perf]
inherits = "release"
opt-level = 2
strip = "symbols"
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.release]
strip = "symbols"
lto = "thin"

[profile.dev]
opt-level = 0
debug = 0
strip = "debuginfo"
incremental = true
codegen-units = 256

[profile.test]
debug = 0
strip = "debuginfo"
incremental = true
codegen-units = 256
