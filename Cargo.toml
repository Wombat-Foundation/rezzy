[package]
name = "rezzy"
version = "0.4.0"
edition = "2021"
autobins = false
authors = ["Shane Jaroch <chown_tee@proton.me>"]
description = "Lightweight and formally verified: State Res v1, v2, and v2.1 reference implementations in Rust."
license = "MIT OR Apache-2.0"
repository = "https://github.com/gamesguru/rezzy"
autotests = false
default-run = "rezzy"
exclude = [
    "res/",
    "scripts/",
    "docs/",
    "RumaLean/",
    "RumaLean.lean",
    "lake*",
    "lean-toolchain",
    ".codecov.yml",
    ".envrc",
    ".env.example",
    ".github",
    ".gitignore",
    ".editorconfig",
    ".pre-commit-config.yaml",
    ".prettierignore",
    ".prettierrc",
    ".rgignore",
    ".ignore",
    ".gitmodules",
    ".typos.toml",
    "rustfmt.toml",
    "tests/",
    "Makefile",
]

[[bin]]
name = "rezzy"
path = "src/bin/rezzy/main.rs"
required-features = ["cli"]

[[bin]]
name = "regen_oracles"
path = "tests/regen_oracles.rs"
required-features = ["regen"]

[features]
default = ["std"]
std = ["alloc", "serde_json/std", "serde/std"]
alloc = []
cli = ["std", "dep:clap", "dep:anyhow", "dep:ureq", "mimalloc"]
regen = ["std"]
hashing = ["dep:sha2", "dep:base64"]
mock-ruma = [
    "dep:insta",
    "dep:ruma-common",
    "dep:ruma-events",
    "dep:ruma-state-res",
    "dep:test-log",
    "dep:tracing-subscriber",
]
stress = ["dep:bincode"]
mimalloc = ["dep:mimalloc"]

[dependencies]
anyhow = { version = "1.0", optional = true }
base64 = { version = "0.22.1", optional = true }
bincode = { version = "1", optional = true }
clap = { version = "4.4", optional = true, features = ["derive", "env"] }
hashbrown = { version = "0.15", default-features = false, features = ["default-hasher", "inline-more"] }
imbl = { version = "4", default-features = false, features = ["serde"] }
insta = { version = "1.47.2", optional = true }
mimalloc = { version = "0.1.52", optional = true }
roaring = "0.11.4"
ruma-common = { version = "0.19.0", optional = true }
ruma-events = { version = "0.34.0", optional = true }
ruma-state-res = { version = "0.17.0", optional = true, features = ["__criterion"] }

serde = { version = "1.0", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
sha2 = { version = "0.11.0", optional = true }
test-log = { version = "0.2.20", optional = true }
tracing-subscriber = { version = "0.3.23", optional = true }
ureq = { version = "2.9", optional = true, features = ["json"] }

[dev-dependencies]
similar = "3.1.0"

[[test]]
name = "test_snapshots"
path = "tests/test_snapshots.rs"
required-features = ["stress"]

[[test]]
name = "test_sanity"
path = "tests/test_sanity.rs"

[[test]]
name = "test_hashing"
path = "tests/test_hashing.rs"

[[test]]
name = "test_traversal"
path = "tests/test_traversal.rs"

[[test]]
name = "stress_large_rooms"
path = "tests/stress_large_rooms.rs"
required-features = ["stress"]

[[test]]
name = "test_pathologies"
path = "tests/test_pathologies.rs"

[[test]]
name = "test_critique"
path = "tests/test_critique.rs"

[[test]]
name = "test_auth"
path = "tests/test_auth.rs"

[[test]]
name = "test_lib"
path = "tests/test_lib.rs"

[[test]]
name = "test_main"
path = "tests/test_main.rs"
required-features = ["cli"]

[[test]]
name = "stress_unredacted_lounge"
path = "tests/stress_unredacted_lounge.rs"
required-features = ["stress"]

[[test]]
name = "test_integer_keys"
path = "tests/test_integer_keys.rs"

[[test]]
name = "test_restricted_joins"
path = "tests/test_restricted_joins.rs"

[[test]]
name = "test_utils"
path = "tests/test_utils.rs"

[[test]]
name = "test_tombstone"
path = "tests/test_tombstone.rs"

[[test]]
name = "test_state_at"
path = "tests/test_state_at.rs"

[[test]]
name = "test_resolve"
path = "tests/test_resolve.rs"
required-features = ["mock-ruma"]

[[test]]
name = "test_lattice"
path = "tests/test_lattice.rs"

[lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(tarpaulin)"] }

[lints.clippy]
pedantic = "warn"
perf = "warn"
complexity = "warn"
style = "warn"
correctness = "warn"
suspicious = "warn"

# High-Value Security & Robustness restrictions
arithmetic_side_effects = "warn"
undocumented_unsafe_blocks = "warn"
dbg_macro = "warn"
get_unwrap = "warn"

[profile.release-max-perf]
inherits = "release"
strip = "symbols"
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.release]
strip = "symbols"
lto = "thin"
