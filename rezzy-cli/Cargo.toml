[package]
name = "rezzy-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "../README.md"
description = "CLI binary for the rezzy Matrix state resolution engine."
keywords = ["matrix", "state-resolution", "federation", "cli"]
categories = ["command-line-utilities"]
autobins = false

[[bin]]
name = "rezzy"
path = "src/main.rs"

[features]
default = ["std"]
std = ["rezzy/std", "clap/std"]
mimalloc = ["dep:mimalloc"]
tls = [
    "ureq/rustls",
    "dep:ed25519-consensus",
    "ed25519-consensus/std",
    "dep:keyring",
]

[dependencies]
base64.workspace = true
clap.workspace = true
clap_complete.workspace = true
ed25519-consensus = { workspace = true, optional = true }
imbl.workspace = true
keyring = { workspace = true, optional = true }
mimalloc = { workspace = true, optional = true }
rezzy = { workspace = true, features = ["cli"] }
roaring.workspace = true
sha2.workspace = true
ureq.workspace = true

[lints]
workspace = true
