[package]
name = "rz-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "CLI binary for the rezzy Matrix state resolution engine."
keywords = ["matrix", "state-resolution", "federation", "cli"]
categories = ["command-line-utilities"]
autobins = false

[package.metadata.cargo-machete]
ignored = ["idna_adapter"]

[[bin]]
name = "rezzy"
path = "src/main.rs"

[features]
default = ["std"]
std = ["rz-core/std", "clap/std"]
mimalloc = ["dep:mimalloc"]

[dependencies]
clap.workspace = true
# Direct version anchor for the `ureq` -> `url` -> `idna` -> `idna_adapter`
# chain: idna_adapter >= 1.2 requires rustc 1.86, above our MSRV.
idna_adapter = { version = ">=1.0, <1.2", default-features = false }
imbl.workspace = true
mimalloc = { workspace = true, optional = true }
roaring.workspace = true
rz-core = { workspace = true, features = ["cli"] }
sha2.workspace = true
ureq.workspace = true

[lints]
workspace = true
