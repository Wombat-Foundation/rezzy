[package]
name = "rz-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "CLI binary for the rezzy Matrix state resolution engine."
keywords = ["matrix", "state-resolution", "federation", "cli"]
categories = ["command-line-utilities"]
autobins = false

[[bin]]
name = "rezzy"
path = "src/main.rs"

[features]
default = ["std"]
std = ["rz-core/std", "clap/std"]
mimalloc = ["dep:mimalloc"]

[dependencies]
clap.workspace = true
idna_adapter.workspace = true
imbl.workspace = true
mimalloc = { workspace = true, optional = true }
roaring.workspace = true
rz-core = { workspace = true, features = ["cli"] }
serde_json.workspace = true
simd-json.workspace = true
ureq.workspace = true

[lints]
workspace = true
